services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: redpill_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  bot:
    build: .
    container_name: redpill_bot
    depends_on:
      - qdrant
    env_file:
      - .env
    restart: unless-stopped